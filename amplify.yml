version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - env | grep -E '^(MONGODB_URI|MONGODB_DATABASE|SESSION_SECRET)=' > apps/web/.env.production
            - pnpm --filter web build
      artifacts:
        baseDirectory: apps/web/build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
