version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - "node -e 'const fs = require(\"node:fs\"); const names = [\"MONGODB_URI\", \"MONGODB_DATABASE\", \"SESSION_SECRET\"]; const secrets = JSON.parse(process.env.secrets || \"{}\"); const missing = names.filter((name) => typeof secrets[name] !== \"string\"); if (missing.length) throw new Error(`Missing Amplify environment secrets: ${missing.join(\", \")}`); fs.writeFileSync(\"apps/web/.env.production\", names.map((name) => `${name}=${JSON.stringify(secrets[name])}`).join(\"\\n\") + \"\\n\");'"
            - pnpm --filter web build
      artifacts:
        baseDirectory: apps/web/build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
